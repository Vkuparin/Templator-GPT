name: Verify Windows app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and verify
        shell: pwsh
        run: ./scripts/Verify.ps1
      - name: Package portable executable
        shell: pwsh
        run: ./scripts/Publish.ps1
      - name: Upload portable build and UI renders
        uses: actions/upload-artifact@v4
        with:
          name: Templator-win-x64
          path: |
            artifacts/Templator-portable-win-x64.zip
            artifacts/ui/*.png
